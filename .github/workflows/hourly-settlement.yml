name: Hourly Signal Settlement & Lifecycle Engine

on:
  schedule:
    # Hourly from 09:00 to 23:00 Cairo Time (UTC+2 is 07:00 to 21:00 UTC), Monday through Friday
    - cron: '0 7-21 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  hourly-settlement:
    name: Run Hourly Settlement
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Hourly Settlement
        env:
          ALLTICK_TOKEN: ${{ secrets.ALLTICK_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npx tsx scripts/serverScheduler.ts hourly-settlement
